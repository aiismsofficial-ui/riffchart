[project]
name = "riffchart"
version = "1.0.0"
description = "RiffChart: audio -> Clone Hero / YARG 5-fret guitar charts"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.13",
    "soxr>=0.5",
    "mido>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pandas>=2.2",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "scipy>=1.14",
    "librosa>=0.10.2",
    "demucs>=4.0.1",
    "tensorboard>=2.18",
    "mir-eval>=0.8.2",
    "beat-this==1.1.0",
    "scikit-learn==1.9.1",
    "mutagen==1.47.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.33",
    "torchcrepe==0.0.24",
    "av==19.0.2",
    "pillow==13.0.0",
]

[project.optional-dependencies]
# PyTorch: pick one. cpu = any PC (smaller download); cuda = NVIDIA GTX 16 / RTX 20-series or newer (CUDA 13)
cpu = ["torch==2.11.0", "torchaudio==2.11.0"]
cuda = ["torch==2.11.0", "torchaudio==2.11.0", "triton-windows>=3.7,<3.8"]
dev = [
    "onnx>=1.23.2",
    "onnxruntime-gpu>=1.31.1",
    "httpx>=0.28.1",
    "imageio-ffmpeg==0.8.1",
    "playwright==1.64.1",
    "pytest>=8",
]

[project.scripts]
riffchart-audit = "riffchart.data.cli:main"
riffchart = "riffchart.product.cli:main"
riffchart-ui = "riffchart.ui.server:main"

[tool.uv]
index-strategy = "unsafe-best-match"
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu130", extra = "cuda" }]
torchaudio = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu130", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riffchart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
