# Phase 1 data pipeline settings
# Put this PC's folders in configs/data.local.yaml (gitignored; merged over this file).
library_root: "path/to/your/chart/library"   # READ-ONLY, never written to
# Further libraries (song ids hash "<tag>/<relative path>", so the main library's ids never change).
# Each gets held-out splits val_<tag> / test_<tag>; `prefer: true` wins duplicate groups in dedup.
extra_libraries: []
#  - tag: extra
#    root: "path/to/another/library"
#    val_songs: 50
#    test_songs: 80
#    prefer: false
data_root: "data"                                        # all derived data lives here

audit:
  workers: 12
  sr: 16000              # analysis sample rate for onset / fingerprint features
  hop: 160               # 100 frames per second
  note_sigma_frames: 1.5 # gaussian smoothing of the note impulse train
  wide_lag_s: 8.0        # search range for the raw (no offset) lag, covers song.ini delays
  local_lag_s: 0.15      # search range around the hypothesised offset (beat periodicity => keep narrow)
  expected_latency_ms: 25 # onset-envelope latency measured on the library (first audit run median: 24.9 ms)
  peak_tie: 0.85         # a farther correlation peak must beat the nearest one by >1/0.85 to win
  window_s: 30.0         # drift check window
  min_window_notes: 24
  # flags (applied in the report step, relative to the library-wide median lag)
  max_lag_dev_ms: 35
  max_drift_ms: 60
  min_local_ratio: 0.85  # local peak vs best peak within +-1 s (lower = likely off by a beat)
  min_hit50: 0.5         # share of notes with an audio onset within +-50 ms
  min_bpm: 20
  max_bpm: 1000

dedup:
  duration_tol_s: 6.0
  chroma_corr_min: 0.90  # chroma-sequence correlation to call two recordings the same song

split:
  seed: 1234
  test_songs: 100
  val_songs: 70
  max_artist_songs_eval: 8   # artists with more songs than this always go to train
  test_real_reduction_songs: 35  # songs with genuinely reduced E/M/H charts (not Expert copies)
  val_real_reduction_songs: 20
  # Extra libraries: songs by val/test artists go to val_<tag>/test_<tag> (never train); unseen artists are
  # split artist-disjointly into train + those held-out sets (sizes: val_songs / test_songs per library).

stems:
  model: htdemucs_6s     # beat htdemucs_ft on guitar SDR (3.39 vs 3.15 dB) and is 3.5x faster, see NOTES.md
  segment: null          # model default
  overlap: 0.25
  shifts: 0
  out_format: ogg        # vorbis, stereo 44.1 kHz
  # saved: guitar.ogg + other.ogg (other + piano); bass/drums/vocals discarded to save disk
