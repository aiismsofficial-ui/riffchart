# Phase 6 product settings (paths are relative to the project root)
chart_ckpt: data/checkpoints/chart/full_v2/step60000.pt    # v2, final snapshot
beat_tracker: finetuned                                     # Phase 3 fine-tuned Beat This (fp32)
separation:
  model: htdemucs_6s
  overlap: 0.25
  shifts: 0
decoding:
  temperature: 0.7
  top_p: 1.0
  min_gap: auto            # per-difficulty playability minimum (configs/eval.yaml)
  seed: 0
post_config: configs/post.yaml
audio:
  write_stems: true        # guitar.ogg (separated guitar) + song.ogg (mix minus guitar): CH mutes guitar on misses
  vorbis_quality: 0.6
# diff_guitar from Expert notes per second: cut points midway between the per-level medians of the
# train songs' song.ini ratings (775 rated songs, Spearman 0.52 with notes/s, Phase 6 notes)
diff_guitar_nps_cuts: [2.6, 3.5, 4.05, 4.75, 5.8, 7.5]
follow: auto                   # guitar | auto | all: what to chart where the guitar is quiet (product/follow.py)
