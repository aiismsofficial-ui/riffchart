# Model files the app needs, checked (and downloaded where a url is set) by scripts/get_models.py, which the
# installer runs. The Demucs separation model is public and is fetched by Demucs itself on first use (the
# script fetches it up front so the first song doesn't wait).
# huggingface: the model repo ("<account>/<repo>"); each file downloads from
#   https://huggingface.co/<repo>/resolve/main/<file>. Empty until the models are public: copy the files to
#   `path` by hand until then. A file's own `url:` overrides this.
huggingface: riffchart/riffchart-models
