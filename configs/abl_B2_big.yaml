run: B2_big
out_root: data/checkpoints/chart
model:
  d_model: 512
  n_heads: 8
  enc_layers: 6
  dec_layers: 8
  dropout: 0.15
  tokens_per_beat: 16
model_style: true
data:
  context_beats: 16
  target_beats: 32
  max_tokens: 1536
  difficulty_weights:
    expert: 0.55
    hard: 0.15
    medium: 0.15
    easy: 0.15
  grid_probs:
    human: 0.4
    ft: 0.3
    pt: 0.3
  beat_jitter_s: 0.004
  style_dropout: 0.3
  train_song_limit: null
  metrical_aug: 0.15
augment:
  gain: 1.0
  tilt: 0.7
  balance: 1.0
  drop_guitar: 0.08
  drop_mix: 0.05
train:
  steps: 6000
  batch_size: 32
  lr: 0.0003
  min_lr_ratio: 0.05
  weight_decay: 0.05
  betas:
  - 0.9
  - 0.95
  warmup_steps: 1000
  grad_clip: 1.0
  num_workers: 14
  compile: true
  eval_every: 1500
  val_windows: 512
  log_every: 50
  seed: 0
