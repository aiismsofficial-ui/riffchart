# Phase 6 product settings (paths are relative to the project root)
device: auto              # auto (GPU if available: NVIDIA, or AMD with a ROCm build of PyTorch; else CPU) | cuda | cpu
chart_ckpt: data/checkpoints/chart/full_v2/step60000.pt    # v2, final snapshot
beat_tracker: finetuned                                     # Phase 3 fine-tuned Beat This (fp32)
separation:
  model: htdemucs_6s
  overlap: 0.25
  shifts: 0
decoding:
  temperature: 0.7
  top_p: 1.0
  min_gap: auto            # per-difficulty playability minimum (configs/eval.yaml)
  seed: 0
post_config: configs/post.yaml
audio:
  write_stems: true        # guitar.ogg (separated guitar) + song.ogg (mix minus guitar): CH mutes guitar on misses
  split_instruments: true  # also bass.ogg, drums.ogg, vocals.ogg, keys.ogg (Clone Hero / YARG stem volumes; future bass / drums charts)
  vorbis_quality: 0.6
highway: riffchart         # each song's highway.png (Clone Hero: Song Highways setting): riffchart | cover | none
keep_video: true           # charting a music video (mp4 / webm / mkv) keeps its picture as video.mp4 / .webm
sections: auto             # auto = name the parts (Intro, Verse 1, Chorus 1, ...) from the audio; off = none
lyrics: online             # online = find lyrics on lrclib.net (sends artist, title, length) and time them to the singing; off = none
background_quality: screen  # animated song backgrounds: screen (your screen's resolution, ~100 MB a song) | 1440 | 1080 (smallest)
convert_video: true        # ...and converts VP9 / AV1 / HEVC (most YouTube downloads) to VP8 webm, which Clone Hero plays
# diff_guitar from Expert notes per second: cut points midway between the per-level medians of the
# train songs' song.ini ratings (775 rated songs, Spearman 0.52 with notes/s, Phase 6 notes)
diff_guitar_nps_cuts: [2.6, 3.5, 4.05, 4.75, 5.8, 7.5]
difficulty_model: configs/difficulty.yaml   # fitted estimator (scripts/fit_difficulty.py); the cuts above are the fallback
follow: auto                   # guitar | auto | all: what to chart where the guitar is quiet (product/follow.py)
